<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="range" name="vol" id="1" min="0" max="100" value="10">
    <p id="2">0</p>
    
    <br>

    <!-- "for" matches the id of the range input -->
    <label for="volumeSlider">Volume Control</label>
    <input type="range" id="volumeSlider" name="vol">
    
    <br>

    <input type="file" accept="audio/*">


    <script>
        const range = document.getElementById("1")
        const ptag = document.getElementById("2");

        range.addEventListener("input", ()=>{
            ptag.textContent = range.value;
        })

    </script>
</body>
</html>
