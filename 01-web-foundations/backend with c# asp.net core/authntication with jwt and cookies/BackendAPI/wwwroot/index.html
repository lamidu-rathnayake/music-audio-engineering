<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>System Login</title>
        <style>
            body {
                font-family:
                    system-ui,
                    -apple-system,
                    sans-serif;
                background-color: #f4f4f5;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }
            .login-container {
                background: white;
                padding: 2.5rem;
                border-radius: 8px;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
                width: 100%;
                max-width: 320px;
            }
            .form-group {
                margin-bottom: 1.25rem;
            }
            label {
                display: block;
                margin-bottom: 0.5rem;
                font-weight: 500;
                color: #374151;
            }
            input {
                width: 100%;
                padding: 0.75rem;
                border: 1px solid #d1d5db;
                border-radius: 4px;
                box-sizing: border-box;
            }
            button {
                width: 100%;
                padding: 0.75rem;
                background: #111827;
                color: white;
                border: none;
                border-radius: 4px;
                font-weight: 600;
                cursor: pointer;
            }
            button:hover {
                background: #374151;
            }
            #error-message {
                color: #dc2626;
                font-size: 0.875rem;
                margin-top: 1rem;
                text-align: center;
                min-height: 20px;
            }
        </style>
    </head>
    <body>
        <div class="login-container">
            <h2 style="margin-top: 0; color: #111827">System Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required autocomplete="username"/>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required autocomplete="current-password"/>
                </div>
                <button type="submit">Authenticate</button>
            </form>
            <div id="error-message"></div>
        </div>
        
        <script>
            // port must match the launchSettings.json
            const API_BASE_URL = "https://localhost:5269/api";
            const errorContainer = document.getElementById("error-message");
            
            document.getElementById("loginForm").addEventListener("submit", async (e) => {
                    e.preventDefault();

                    errorContainer.textContent = "";

                    const usernameInput = document.getElementById("username").value;
                    const passwordInput = document.getElementById("password").value;

                    try {
                        // you dont have to include the credentials for getting the cookie
                        const response = await fetch(`${API_BASE_URL}/login`, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                            },
                            body: JSON.stringify({
                                username: usernameInput,
                                password: passwordInput,
                            }),
                        });

                        if (response.ok) {
                            const data = await response.json();
                            if (data.role === "Admin") {
                                document.location = "/admin"
                            } else if (data.role === "User") {
                                document.location = "/user"
                            }
                        } else if (response.status === 401) {
                            errorContainer.textContent = "Invalid credentials. Please try again.";
                        } else {
                            errorContainer.textContent = "Server rejected the request.";
                        }
                    } catch (error) {
                        console.error("Fetch Error:", error);
                        errorContainer.textContent = "Failed to connect to the authentication server.";
                    }
                });
        </script>
    </body>
</html>
